<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dzienniczek żywieniowy — Premium</title>
    <link rel="stylesheet" href="/css/main.css">

    <style>
        /* ⭐ pełne wycentrowanie kart posiłków */
        .entry-item {
            display: flex;
            align-items: center;
            justify-content: center; /* wycentrowanie poziome */
            gap: 20px; /* odstęp między ikoną, treścią i przyciskami */
            padding: 12px;
        }

        .entry-content {
            flex: 1;
            text-align: center; /* wyjustowanie tekstu */
        }

        .entry-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .entry-icon {
            width: 40px;
            height: 40px;
        }

        .day-header h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        /* ⭐ PREMIUM SNACKBAR */
        .snackbar {
            visibility: hidden;
            min-width: 260px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 14px 20px;
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 16px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s, bottom 0.4s;
        }

        .snackbar-show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        .snackbar-success {
            background-color: #4CAF50;
        }

        .snackbar-error {
            background-color: #E53935;
        }
    </style>
</head>
<body>

<div class="layout-three-columns">

    <!-- LEWA KOLUMNA — WPISY -->
    <div class="left-column">

        <h2 class="title-premium">Wpisy</h2>

        <form action="/filter" method="get" class="filter-form">
            <select name="meal" class="filter-select" onchange="this.form.submit()">
                <option th:selected="${selectedFilter == 'Wszystkie'}">Wszystkie</option>
                <option value="śniadanie" th:selected="${selectedFilter == 'śniadanie'}">Śniadanie</option>
                <option value="obiad" th:selected="${selectedFilter == 'obiad'}">Obiad</option>
                <option value="kolacja" th:selected="${selectedFilter == 'kolacja'}">Kolacja</option>
                <option value="przekąska" th:selected="${selectedFilter == 'przekąska'}">Przekąska</option>
                <option value="inne" th:selected="${selectedFilter == 'inne'}">Inne</option>
            </select>
        </form>

        <div class="daily-entries">

            <div th:each="day : ${entriesByDate}">
                <div class="day-header">
                    <h3>
                        <span th:text="${#temporals.format(day.value[0].date, 'yyyy-MM-dd')}"></span>
                        —
                        <span th:text="${day.value[0].dayName}"></span>
                    </h3>
                </div>

                <div class="entries">

                    <div th:each="entry : ${day.value}"
                         class="entry-item premium-card"
                         th:classappend="${entry.mealType == 'śniadanie' ? ' meal-breakfast' :
                                         (entry.mealType == 'obiad' ? ' meal-lunch' :
                                         (entry.mealType == 'kolacja' ? ' meal-dinner' :
                                         (entry.mealType == 'przekąska' ? ' meal-snack' : ' meal-other')))}">

                        <img class="entry-icon"
                             th:src="${entry.mealType == 'śniadanie' ? '/icons/breakfast.svg' :
                                     (entry.mealType == 'obiad' ? '/icons/lunch.svg' :
                                     (entry.mealType == 'kolacja' ? '/icons/dinner.svg' :
                                     (entry.mealType == 'przekąska' ? '/icons/snack.svg' : '/icons/other.svg')))}">

                        <div class="entry-content">
                            <strong th:text="${entry.mealName}"></strong> —
                            <span th:text="${entry.calories}"></span> kcal
                            <br><br>
                            <em th:text="${entry.description}"></em>
                        </div>

                        <div class="entry-actions">
                            <form th:action="@{'/delete/' + ${entry.id}}" method="post">
                                <button class="delete-btn">Usuń</button>
                            </form>

                            <button type="button"
                                    class="edit-btn"
                                    th:attr="data-id=${entry.id},
                                             data-meal=${entry.mealName},
                                             data-calories=${entry.calories},
                                             data-date=${entry.date},
                                             data-description=${entry.description}"
                                    onclick="openEditFromButton(this)">
                                Edytuj
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ŚRODKOWA KOLUMNA — DODAJ WPIS -->
    <div class="middle-column">
        <div class="premium-form">
            <h2 class="title-premium">Dodaj wpis</h2>
            <form th:action="@{/save}" th:object="${foodEntry}" method="post">

                <label>Rodzaj posiłku:</label>
                <select th:field="*{mealName}" class="meal-select-with-icon form-input" id="mealSelect" required>
                    <option value="Śniadanie">Śniadanie</option>
                    <option value="Obiad">Obiad</option>
                    <option value="Kolacja">Kolacja</option>
                    <option value="Przekąska">Przekąska</option>
                    <option value="Inne">Inne</option>
                </select>

                <label>Kalorie:</label>
                <input type="number" th:field="*{calories}" class="form-input" min="0" step="1" required>

                <label>Data:</label>
                <input type="date" th:field="*{date}" class="form-input" id="dateField" required>

                <label>Opis:</label>
                <textarea th:field="*{description}" class="form-input" rows="4"></textarea>

                <button type="submit" class="premium-btn">Zapisz</button>
            </form>
        </div>

        <div class="premium-form" style="margin-top: 20px;">
            <h2 class="title-premium">Import z planu żywieniowego (zdjęcie)</h2>

            <form action="/import/photo" method="post" enctype="multipart/form-data">
                <label>Zdjęcie planu żywieniowego (tydzień):</label>

                <div class="file-row">
                    <input type="file" name="file" id="fileUpload" accept="image/*" class="file-input" required>
                    <label for="fileUpload" class="file-label">Wybierz plik</label>
                    <span id="file-name" class="file-name"></span>
                </div>

                <button type="submit" class="premium-btn">Importuj z zdjęcia</button>
            </form>
        </div>

        <div class="premium-form" style="margin-top: 20px;">
            <h2 class="title-premium">Import jadłospisu ze strony żłobka</h2>

            <button type="button" class="premium-btn" onclick="importMenu()">Importuj jadłospis</button>

            <!-- ⭐ Premium Alert tuż pod przyciskiem -->
            <div id="import-alert" class="premium-alert" style="display:none;"></div>
        </div>

        <a href="/pdf/food-entries" class="pdf-btn">
            <img src="/icons/pdf.svg" class="pdf-icon">
            Pobierz PDF
        </a>

    </div>

    <!-- PRAWA KOLUMNA — EDYTUJ WPIS -->
    <div class="right-column">

        <div id="edit-section" class="premium-form" style="display:none;">

            <h2 class="title-premium">Edytuj wpis</h2>

            <form th:action="@{/update}" method="post">

                <input type="hidden" id="edit-id" name="id">

                <label>Rodzaj posiłku:</label>
                <select id="edit-mealName" name="mealName" class="meal-select-with-icon form-input" required>
                    <option value="Śniadanie">Śniadanie</option>
                    <option value="Obiad">Obiad</option>
                    <option value="Kolacja">Kolacja</option>
                    <option value="Przekąska">Przekąska</option>
                    <option value="Inne">Inne</option>
                </select>

                <label>Kalorie:</label>
                <input type="number" id="edit-calories" name="calories" class="form-input" required>

                <label>Data:</label>
                <input type="date" id="edit-date" name="date" class="form-input" required>

                <label>Opis:</label>
                <textarea id="edit-description" name="description" class="form-input" rows="4"></textarea>

                <button type="submit" class="premium-btn">Zaktualizuj</button>
                <button type="button" class="premium-btn" onclick="closeEdit()">Zamknij</button>

            </form>

        </div>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
